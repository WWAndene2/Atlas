name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Ghidra is 570 MB: keep the unpacked install between runs. The key names the version, so a bump downloads again
      # (setup still checks the archive's SHA-256 whenever it downloads).
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/atlas/tools
          key: atlas-tools-ghidra-12.1.4
      - run: scripts/setup.sh
      # Everything setup installs is required here: a missing fixture fails instead of skipping its tests.
      - run: npm run check
        env:
          ATLAS_REQUIRE_FIXTURES: "1"
